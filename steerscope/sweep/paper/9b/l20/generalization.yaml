  steering_model_name: google/gemma-2-9b-it
  steering_batch_size: 5
  steering_output_length: 128
  steering_layers:
  - 20
  runtime_backend: legacy
  easysteer_url: http://127.0.0.1:8017
  easysteer_timeout: 180
  master_data_dir: steerscope/data
  seed: 42
  lm_model: gpt-4o-mini
  temperature: 1.0
  evaluators:
    best_factor:
      type: BestFactorEvaluator
      depends_on: []
      input:
        path: __STEERSCOPE_PHASE1_ID_METRICS__
      report:
        enabled: true
      params:
        metric: lm_judge_rating
        group_by:
        - method
        strategy: argmax
        aggregation: mean
        baseline_factor: 0.0
    prompt_generalization:
      type: PromptGeneralizationEvaluator
      depends_on:
      - best_factor
      concepts:
        genres:
        - text
        count: 50
        seed: 42
      report:
        enabled: true
      params:
        judge_concurrency: 8
        judge_pipeline_enabled: true
        min_id_effect: 0.1
